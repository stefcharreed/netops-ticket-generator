[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-ticket-generator"
version = "0.1.0"
description = "Generate realistic network-incident practice tickets and evidence packets with validated answer keys"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.400"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
